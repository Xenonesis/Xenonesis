name: Generate Snake Animation

on:
  # Schedule daily at midnight UTC
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00 UTC

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate GitHub Contribution Snake
    permissions:
      contents: write # Required to push the generated SVG to the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Set a timeout to prevent long-running jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Use a specific version for stability

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Last Updated Badge in README
        run: |
          CURRENT_DATE=$(date +%Y--%m--%d)
          sed -i "s/LAST%20UPDATED-[0-9]\{4\}--[0-9]\{2\}--[0-9]\{2\}/LAST%20UPDATED-${CURRENT_DATE}/g" README.md
          git add README.md
          git commit -m "Update Last Updated badge in README.md" || echo "No changes to commit"

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3 # Action to generate the snake animation
        with:
          github_user_name: Xenonesis # Your GitHub username
          outputs: |
            dist/github-contribution-grid-snake.svg # Output path for light theme SVG
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark # Output path for dark theme SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub token for repository access

      - name: Push generated SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0 # Action to push files to a specific branch
        with:
          target_branch: output # The branch where the SVG will be pushed
          build_dir: dist # The directory containing the generated SVG files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub token for pushing to the branch
