name: Test GitHub Repository Secrets

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main, master ]
    paths: 
      - 'test-env.py'
      - '.github/workflows/test-secrets.yml'

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Test Repository Secrets
      env:
        GH_USERNAME: ${{ secrets.GH_USERNAME }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        echo "🧪 Testing GitHub Repository Secrets Configuration"
        python test-env.py
    
    - name: Verify Analytics System
      env:
        GH_USERNAME: ${{ secrets.GH_USERNAME }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        echo "🔍 Testing analytics system compatibility"
        python -c "
        import os
        print('✅ Username available:', bool(os.getenv('GH_USERNAME')))
        print('✅ Token available:', bool(os.getenv('GH_TOKEN')))
        print('✅ Ready for analytics:', bool(os.getenv('GH_USERNAME') and os.getenv('GH_TOKEN')))
        "